name: Verify preserved FLOYD installer
on:
  workflow_dispatch:
  push:
    branches: [codex/complete-installer]
    paths:
      - '.github/workflows/verify-existing-installer.yml'
      - 'scripts/verification/**'
      - 'scripts/verify-installed-application.sh'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      FLOYD_EXPECTED_SOURCE_COMMIT: 1a5db7805be7b1026ba54d73773ce3d7d612489a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.0'
      - uses: actions/download-artifact@v8
        with:
          name: floyd-system-package
          path: dist
          run-id: 33988702136
          github-token: ${{ github.token }}
      - run: npm ci --prefix scripts/verification --no-audit --no-fund
      - name: Prepare disposable default browser
        timeout-minutes: 2
        run: node scripts/verification/installed-ui.mjs prepare
      - name: Install preserved package
        run: sudo installer -pkg dist/FLOYD-0.2.2.pkg -target /
      - name: Verify installed application
        run: ./scripts/verify-installed-application.sh
      - name: Capture cloud failure state
        if: failure()
        run: |
          mkdir -p dist/installed-ui-evidence
          /usr/sbin/screencapture -x dist/installed-ui-evidence/cloud-screen.png || true
          pgrep -fal 'Google Chrome|FLOYD' || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-application-evidence
          path: dist/installed-ui-evidence/
          if-no-files-found: warn
