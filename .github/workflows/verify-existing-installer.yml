name: Verify preserved FLOYD installer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      FLOYD_EXPECTED_SOURCE_COMMIT: 2439b6e580b4e82aeccafc79fb435949bb0207de
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.0'
      - uses: actions/download-artifact@v8
        with:
          name: floyd-clean-macos-installer
          run-id: 33987422106
          github-token: ${{ github.token }}
      - name: Preserve independently downloadable app
        uses: actions/upload-artifact@v7
        with:
          name: floyd-0.2.2-user-app
          compression-level: 0
          path: |
            dist/FLOYD-0.2.2.app.zip
            scripts/install-for-user.sh
            dist/manifest.json
      - name: Preserve independently downloadable package
        uses: actions/upload-artifact@v7
        with:
          name: floyd-0.2.2-system-package
          compression-level: 0
          path: |
            dist/FLOYD-0.2.2.pkg
            dist/manifest.json
      - run: npm ci --prefix scripts/verification --no-audit --no-fund
      - name: Prepare disposable default browser
        timeout-minutes: 2
        run: node scripts/verification/installed-ui.mjs prepare
      - name: Install preserved package
        run: sudo installer -pkg dist/FLOYD-0.2.2.pkg -target /
      - name: Verify installed application
        run: ./scripts/verify-installed-application.sh
      - name: Capture cloud failure state
        if: failure()
        run: |
          mkdir -p dist/installed-ui-evidence
          /usr/sbin/screencapture -x dist/installed-ui-evidence/cloud-screen.png || true
          pgrep -fal 'Google Chrome|FLOYD' || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-application-evidence
          path: dist/installed-ui-evidence/
          if-no-files-found: warn
