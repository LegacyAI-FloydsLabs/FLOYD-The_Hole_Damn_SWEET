name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # src/server.js falls back to /bin/zsh when SHELL is unset; zsh is not
      # installed on ubuntu-latest. Bash is the default login shell on the
      # runner, so mirror that explicitly to keep the spawned PTY healthy.
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v4

      # node-pty is a native addon with no prebuilt binaries — it compiles
      # via node-gyp on install. ubuntu-latest ships build-essential by
      # default, but install explicitly so a runner image change can never
      # break the build silently.
      - name: Install build tools (for node-pty native compile)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a stable major tag instead of @master so a breaking
      # change upstream can't silently turn CI red.
      - name: Run shellcheck on scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          severity: warning
